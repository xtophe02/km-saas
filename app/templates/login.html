{% extends "base.html" %}
{% block title %}Login - MileTrack{% endblock %}
{% block content %}
<article style="max-width: 400px; margin: 2rem auto;">
    <h2>Login</h2>
    {% if error %}
    <p class="error" style="color: var(--pico-del-color);">{{ error }}</p>
    {% endif %}
    <form method="post" action="/login">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autofocus>
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
        <button type="submit">Sign In</button>
    </form>
    <small>Account required. Contact your administrator for access.</small>
</article>
{% endblock %}
